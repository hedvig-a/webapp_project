<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="res/images/favicon.ico">
    <link rel="stylesheet" href="res/css/style.css">
    <title>Log in</title>
</head>

<body>
    <header class="header">
        <ul class="nav">
            <li><a class href="./index.html">Home</a></li>
        </ul>
        <ul class="img">
            <li>
                <a href="#">
                    <img src="res/images/me.png"
                         width="50"
                         height="50"
                         alt="profile"
                    >
                </a>
            </li>
        </ul>
    </header>

    <section class="main fill">
        <div class="content-center">
            <div class="login-card">
                <div class="login-row">
                   <h1 class="login-h1">Welcome to PostIt</h1>
                </div>
                <div class="login-row">
                    <a href=" ">Create an account</a>
                    <h2 class="login-h2">or</h2>
                    <h2 class="login-h2">please log in</h2>
                </div>
                <div class="login-row">
                    <input class="login-input"
                        type="email"
                        id="email"
                        name="email"
                        size="20"
                        placeholder="email">
                    <input class="login-input"
                            type="text"
                            id="password"
                            name="password"
                            size="20"
                            placeholder="password">
                </div>
                <div class="login-row">
                    <button
                            id="logIn"
                            name="logIn"
                            class="button-secondary text-label"
                    >Log in</button>
                </div>
                <div class="login-row">
                    <a href=" ">Forget password</a>
                </div>
            </div>
        </div>
    </section>
</body>
