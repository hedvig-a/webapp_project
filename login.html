<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="res/images/favicon.ico">
    <link rel="stylesheet" href="res/css/style.css">
    <title>Log in</title>
</head>

<body>
    <header class="header">
        <ul class="nav">
            <li><a class href="./index.html">Home</a></li>
        </ul>
    </header>

    <section class="fill">
        <div class="content-center">
            <form action="./index.html" class="form-card">
                <div class="login-row">
                   <h1>Welcome to PostIt</h1>
                </div>
                <div class="login-row">
                    <a href=" ">Create an account</a>
                    <h2>or</h2>
                    <h2>please log in</h2>
                </div>
                <div class="login-row">
                    <input
                        type="email"
                        id="email"
                        name="email"
                        size="20"
                        placeholder="email"
                        required
                    >
                    <p class="error-text">This field is required</p>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        size="20"
                        placeholder="password"
                        required
                    >
                    <p class="error-text">This field is required</p>
                </div>
                <div class="login-row">
                    <button
                        id="logIn"
                        class="button-secondary text-label"
                        type="submit"
                    >Log in</button>
                </div>
                <div class="login-row">
                    <a href=" ">Forget password</a>
                </div>
            </form>
        </div>
    </section>

    <footer class="footer">
        <ul class="footer-items">
            <li>hi i am a footer</li>
        </ul>
    </footer>
</body>
</html>
